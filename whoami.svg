<svg
  width="751"
  height="810"
  viewBox="0 0 751 810"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Terminal background gradient -->
    <linearGradient id="terminalBg" x1="0" y1="0" x2="751" y2="810">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>

    <!-- Cyan glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.45"/>
    </filter>

    <!-- Typing cursor -->
    <rect id="cursor"
      x="0"
      y="0"
      width="8"
      height="19"
      fill="#00D9FF">
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Clip paths for terminal typing effect -->
    <clipPath id="line1">
      <rect x="45" y="135" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="0.5s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line2">
      <rect x="45" y="175" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="2s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line3">
      <rect x="45" y="215" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="3.5s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line4">
      <rect x="45" y="255" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="5s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line5">
      <rect x="45" y="330" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="6.5s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line6">
      <rect x="45" y="370" width="0" height="30">
        <animate
          attributeName="width"
          from="0"
          to="650"
          dur="1.5s"
          begin="8s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line7">
      <rect x="45" y="410" width="0" height="30">
